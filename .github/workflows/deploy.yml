# ============================================
# Deploy: 服务器拉取代码、构建并重启 Nitro 服务
# 触发: main 分支 push 或手动触发
# 前提: 服务器 /var/www/myblog 是本仓库的 git 克隆（属主 deploy），
#       已安装 Node >= 20，且 deploy 用户可免密 `sudo systemctl restart myblog`
# ============================================

name: Deploy

on:
  push:
    branches: [main]
    workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SERVER_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts

      - name: Pull, build and restart on server
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} \
            "cd /var/www/myblog && git fetch origin && git reset --hard origin/main && npm ci && npm run build && sudo systemctl restart myblog"
